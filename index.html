<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <!-- Add to Home Screen on iOS: opens fullscreen with no Safari chrome. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Masterpiece" />
    <meta name="description" content="Type an idea. Watch it become code. A free AI coding agent that runs in your browser or on your desktop." />
    <meta name="theme-color" content="#090b10" />
    <!--
      The preview panel deliberately runs generated code, so inline scripts must
      be allowed: a srcdoc iframe inherits this policy. The real boundary is the
      iframe's sandbox attribute, which withholds allow-same-origin so previewed
      code cannot reach this page's storage or account.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' https://js.puter.com https://*.puter.com;
               style-src 'self' 'unsafe-inline';
               img-src 'self' data: blob: https:;
               font-src 'self' data:;
               connect-src 'self' https: wss: ws: http://127.0.0.1:* http://localhost:*;
               frame-src 'self' blob: data: http://127.0.0.1:* https://*.puter.com;
               worker-src 'self' blob:"
    />
    <title>Masterpiece Coder</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/renderer/main.tsx"></script>
    <script>
      /*
       * Safety net for GitHub Pages. This file is the Vite dev entry, so if Pages
       * is pointed at the repo root instead of /docs the module above 404s and the
       * page stays blank. Detect that and send the visitor to the built app.
       * Never fires in dev or in the real build, where the app has mounted.
       */
      setTimeout(function () {
        var root = document.getElementById('root');
        var alreadyBuilt = location.pathname.indexOf('/docs/') !== -1;
        if (!alreadyBuilt && root && root.children.length === 0) location.replace('./docs/');
      }, 1500);
    </script>
  </body>
</html>
